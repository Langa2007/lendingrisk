[project]
name = "tahadhari"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "pydantic>=2",
  "pyyaml",
  "redis",
  "psycopg[binary]",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tahadhari*"]

[tool.ruff]
line-length = 100
